# Optional analytics configuration. The stable gateway remains unchanged unless
# analytics is explicitly started with this file.
enabled: false
runtime:
  device: cuda:0
  require_gpu: true
  inference_max_width: 1920
camera:
  source: gateway
  queue_size: 2
detector:
  model: models/yolo11n.pt
  # Keep partially occluded/distant people; only class=person is accepted by
  # the detector adapter, while temporal/face checks handle weak candidates.
  confidence: 0.28
  inference_size: 640
  # Profiles for Windows GPU evaluation: fast=11n/640, balanced=11s/1280,
  # quality=11s or 11m/960-1280. Production remains explicit below.
  profile: balanced
  profiles:
    fast: {model: models/yolo11n.pt, inference_size: 640}
    balanced: {model: models/yolo11s.pt, inference_size: 1280}
    quality: {model: models/yolo11m.pt, inference_size: 1280}
  # Preserve the real-time 640 path. When few people are found, run one
  # rate-limited 960 pass and require temporal confirmation for weak boxes.
  tiled:
    enabled: true
    grid: [2, 2]
    overlap: 0.15
    confidence: 0.12
    inference_size: 640
    interval_seconds: 4.0
    nms_iou: 0.50
  adaptive:
    enabled: true
    trigger_person_count: 1
    trigger_max_confidence: 0.55
    secondary_inference_size: 960
    secondary_confidence: 0.15
    min_interval_seconds: 0.5
    nms_iou: 0.55
tracker:
  type: bytetrack
  track_buffer: 20
  frame_rate: 4
  track_high_thresh: 0.20
  track_low_thresh: 0.08
  new_track_thresh: 0.20
  match_thresh: 0.90
  allow_simple_fallback: false
  confirmed_only: true
  confirm_hits: 2
  weak_confirm_hits: 4
  weak_confidence: 0.30
  lost_display_seconds: 1.0
face:
  enabled: true
  # 4K source contains small distant faces; 640 misses them.
  det_size: [1280, 1280]
  min_face_size: 24
  min_det_score: 0.5
  recognition_threshold: 0.45
  check_interval_unknown: 0.5
  check_interval_known: 3.0
identity:
  daily_clothing_consistency: true
  daily_gallery_reset_hour: 4
  reid_match_threshold: 0.78
  reid_margin_threshold: 0.08
  gallery_max_samples: 20
reid:
  enabled: true
  model: models/reid/osnet_x0_25_msmt17.pt
  model_id: osnet_x0_25_msmt17_v1
  require_gpu: true
  interval_seconds: 1.0
worktime:
  occlusion_grace_seconds: 20
  session_break_seconds: 120
trajectory:
  smoothing_alpha: 0.35
  history_seconds: 30
  prediction_seconds: 3
  display_history_seconds: 8
  prediction_steps: [0.5, 1.0, 1.5, 2.0, 3.0]
  minimum_movement_pixels: 2.0
session:
  grace_seconds: 5.0
  active_speed_pixels_per_second: 8.0
zones: {}
database:
  path: runtime/person_analytics.db
  global_person_state: runtime/global_persons.json
  reid_gallery_state: runtime/reid_gallery.json
